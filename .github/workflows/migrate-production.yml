# Migrations, seed et mise en ligne de production (ADR-010, BRAIN-37) : au push sur main, depuis
# l'environnement GitHub protégé `production`, seul endroit où existe l'accès propriétaire de la base.
# Deux jobs : la migration, puis le déploiement. L'ordre est garanti par `needs` : migration en échec
# ou annulée, pas de déploiement. Plus de Deployment Check Vercel ni de commit status.
# Le jeton Vercel de production n'existe que dans deploy-production, l'accès à la base que dans
# migrate-production.
name: Production

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Une migration à la fois, jamais annulée en cours de route.
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate-production:
    name: Migration production (job)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    # Permissions du job : elles remplacent celles du workflow ; aucun droit d'écriture ici.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # DATABASE_URL après pnpm install, dans le même job : inévitable, la migration EST du code de dépendance
      # (drizzle-kit) qui doit tenir l'URL propriétaire. Limites : environnement `production` (main seulement),
      # lockfile figé, aucun script d'installation de dépendance exécuté (allowBuilds tous à false dans
      # pnpm-workspace.yaml). Aucune autre clé dans ce job ; NODE_OPTIONS et BASH_ENV vidés sur les étapes.
      - run: pnpm install --frozen-lockfile
      # GITHUB_ACTIONS=true lève le garde-fou NEON_PRODUCTION_HOST : la cible est fixée par le secret.
      - name: Migrer
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_OPTIONS: ""
          BASH_ENV: ""
      # Rejouable : ne crée le workspace d'Antoine qu'une fois, ne modifie jamais une ligne existante.
      - name: Seed
        run: pnpm db:seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Secret, pas variable : un vars.* est affiché en clair dans le bloc env du journal (dépôt public).
          SEED_OWNER_USER_ID: ${{ secrets.SEED_OWNER_USER_ID }}
          NODE_OPTIONS: ""
          BASH_ENV: ""

  # Mise en ligne de la production (BRAIN-37) : seulement après une migration réussie (needs sans always() :
  # migration en échec ou annulée, pas de déploiement). Le script crée par l'API Vercel le déploiement du SHA
  # exact du push et attend qu'il soit prêt. Aucune installation : le script n'a aucune dépendance (Node 24).
  # Le jeton Vercel de production n'existe que dans ce job ; aucun secret de base ici.
  deploy-production:
    name: Déploiement production
    needs: migrate-production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Déployer la production
        run: node scripts/ci/vercel-production-deploy.mjs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_PRODUCTION_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          SHA: ${{ github.sha }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GH_TOKEN: ${{ github.token }}
          DEFAULT_GIT_BRANCH: ${{ github.event.repository.default_branch }}
          NODE_OPTIONS: ""
          BASH_ENV: ""
