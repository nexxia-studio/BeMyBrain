# Migrations et seed de production (ADR-010) : au push sur main, depuis l'environnement GitHub protégé
# `production`, le seul endroit où existe l'accès propriétaire de la branche Neon production.
# Ordre avec Vercel : Vercel construit la production en parallèle, mais une « Deployment Check »
# GitHub (Vercel > Settings > Build and Deployment > Deployment Checks) sur le commit status « Migrer la production »
# retient l'attribution du domaine de production jusqu'au succès de ce job. Aucun secret Vercel.
# Nom du job unique dans le dépôt : Vercel et GitHub identifient les checks par ce nom.
name: Production

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Une migration à la fois, jamais annulée en cours de route.
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate-production:
    name: Migrer la production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    # Permissions du job : elles remplacent celles du workflow, d'où contents: read recopié.
    # statuses: write pour le commit status lu par la Deployment Check de Vercel, rien de plus large.
    # Seul workflow du dépôt à avoir statuses: write (verrouillé par scripts/ci/workflows.test.ts).
    permissions:
      contents: read
      statuses: write
    steps:
      # Deployment Check Vercel : commit status « Migrer la production » sur le commit poussé, en attente ici,
      # succès ou échec au dernier pas. gh (préinstallé sur le runner) et le GITHUB_TOKEN du job : aucune
      # action tierce, aucun secret. Avant l'install : aucun code de dépendance n'a encore tourné.
      - name: Statut Vercel en attente
        run: >-
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA"
          -f state=pending -f context="Migrer la production"
          -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          NODE_OPTIONS: ""
          BASH_ENV: ""
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # DATABASE_URL après pnpm install, dans le même job : inévitable, la migration EST du code de dépendance
      # (drizzle-kit) qui doit tenir l'URL propriétaire. Limites : environnement `production` (main seulement),
      # lockfile figé, aucun script d'installation de dépendance exécuté (allowBuilds tous à false dans
      # pnpm-workspace.yaml). Aucune autre clé dans ce job ; NODE_OPTIONS et BASH_ENV vidés sur les étapes.
      - run: pnpm install --frozen-lockfile
      # GITHUB_ACTIONS=true lève le garde-fou NEON_PRODUCTION_HOST : la cible est fixée par le secret.
      - name: Migrer
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_OPTIONS: ""
          BASH_ENV: ""
      # Rejouable : ne crée le workspace d'Antoine qu'une fois, ne modifie jamais une ligne existante.
      - name: Seed
        run: pnpm db:seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEED_OWNER_USER_ID: ${{ vars.SEED_OWNER_USER_ID }}
          NODE_OPTIONS: ""
          BASH_ENV: ""
      # Toujours exécuté, échec, annulation et délai dépassé compris : success seulement si tout le job a
      # réussi, failure sinon (jamais laissé en attente). job.status passe par l'environnement, pas par le script.
      - name: Statut Vercel final
        if: always()
        run: |
          if [ "$JOB_STATUS" = "success" ]; then state=success; else state=failure; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" -f context="Migrer la production" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
          NODE_OPTIONS: ""
          BASH_ENV: ""
