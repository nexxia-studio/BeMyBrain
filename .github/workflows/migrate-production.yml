# Migrations et seed de production (ADR-010) : au push sur main, depuis l'environnement GitHub protégé
# `production`, le seul endroit où existe l'accès propriétaire de la branche Neon production.
# Ordre avec Vercel : Vercel construit la production en parallèle, mais une « Deployment Check »
# GitHub (Vercel > Settings > Build and Deployment > Deployment Checks) retient l'attribution du domaine
# de production jusqu'au succès du commit status de contexte « Migrer la production ». Vercel lit ce
# contexte (posé par gh api dans status-pending et status-final), pas le nom d'un job. Aucun secret Vercel.
# Trois jobs : statuses: write vit dans deux jobs sans checkout, sans install, sans environnement ni
# secret ; le job qui tient DATABASE_URL n'a que contents: read.
name: Production

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Une migration à la fois, jamais annulée en cours de route.
  group: migrate-production
  cancel-in-progress: false

jobs:
  # Deployment Check Vercel : commit status « Migrer la production » en attente sur le commit poussé.
  # gh (préinstallé sur le runner) et le GITHUB_TOKEN du job : aucune action tierce, aucun code de
  # dépendance, aucun secret, pas d'environnement `production`. Seul workflow du dépôt à avoir
  # statuses: write (verrouillé par scripts/ci/workflows.test.ts).
  status-pending:
    name: Statut Vercel en attente
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Statut Vercel en attente
        run: >-
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA"
          -f state=pending -f context="Migrer la production"
          -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          NODE_OPTIONS: ""
          BASH_ENV: ""

  # Nom affiché distinct du commit status « Migrer la production » : seul ce contexte compte pour Vercel.
  migrate-production:
    name: Migration production (job)
    needs: status-pending
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    # Permissions du job : elles remplacent celles du workflow ; aucun droit d'écriture ici.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # DATABASE_URL après pnpm install, dans le même job : inévitable, la migration EST du code de dépendance
      # (drizzle-kit) qui doit tenir l'URL propriétaire. Limites : environnement `production` (main seulement),
      # lockfile figé, aucun script d'installation de dépendance exécuté (allowBuilds tous à false dans
      # pnpm-workspace.yaml). Aucune autre clé dans ce job ; NODE_OPTIONS et BASH_ENV vidés sur les étapes.
      - run: pnpm install --frozen-lockfile
      # GITHUB_ACTIONS=true lève le garde-fou NEON_PRODUCTION_HOST : la cible est fixée par le secret.
      - name: Migrer
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_OPTIONS: ""
          BASH_ENV: ""
      # Rejouable : ne crée le workspace d'Antoine qu'une fois, ne modifie jamais une ligne existante.
      - name: Seed
        run: pnpm db:seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEED_OWNER_USER_ID: ${{ vars.SEED_OWNER_USER_ID }}
          NODE_OPTIONS: ""
          BASH_ENV: ""

  # Toujours exécuté, échec, annulation et délai dépassé de la migration compris : success seulement si
  # le job de migration a réussi, failure sinon (jamais laissé en attente). Le résultat passe par
  # l'environnement, jamais interpolé dans le script.
  status-final:
    name: Statut Vercel final
    needs: [status-pending, migrate-production]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Statut Vercel final
        run: |
          if [ "$MIGRATE_RESULT" = "success" ]; then state=success; else state=failure; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" -f context="Migrer la production" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          MIGRATE_RESULT: ${{ needs.migrate-production.result }}
          NODE_OPTIONS: ""
          BASH_ENV: ""
