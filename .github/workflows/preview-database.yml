# Base et variables des previews (ADR-010, option A : pas d'intégration Neon–Vercel). À chaque push de
# PR, la CI crée ou retrouve la branche Neon `preview/<branche-git>` (fille de `production`, ADR-005),
# y applique les migrations, pose sur Vercel les variables de runtime de la preview
# (DATABASE_AUTHENTICATED_URL, NEON_AUTH_*), limitées à la branche git, déploie la branche (seule la CI
# déploie les previews : vercel.json coupe les déploiements git hors de main), puis ajoute l'URL de
# branche Vercel aux domaines de confiance Neon Auth de la branche Neon.
# À la fermeture de la PR, ou si la migration ou la publication échoue : variables Vercel de la branche supprimées,
# branche Neon supprimée. Expiration de la branche Neon à 10 jours, repoussée à chaque push.
# Jamais DATABASE_URL sur Vercel. NEON_AUTH_COOKIE_SECRET des previews est posé à la main.
# Dépôt public : toute valeur passée par $GITHUB_ENV est masquée par le script qui l'écrit.
#
# Isolation des clés (audit 2026-11-17) : NEON_API_KEY et VERCEL_TOKEN n'existent que dans des étapes qui
# ne lancent que nos scripts sans dépendance, et jamais après `pnpm install` dans le même job : une
# dépendance compromise pourrait écrire NODE_OPTIONS, BASH_ENV ou PATH dans $GITHUB_ENV / $GITHUB_PATH
# et se faire charger par une étape suivante. NODE_OPTIONS et BASH_ENV vidés en plus sur ces étapes.
#   migrate-preview : neon-branch create (NEON_API_KEY), PUIS install et migrate, sans secret (seulement
#                     l'URL propriétaire de la branche de preview, attendue par la migration ; pas celle
#                     d'app_backend).
#   publish-preview : aucune installation. neon-branch create réinitialise de nouveau les deux mots de
#                     passe (ceux vus par le job précédent ne valent plus rien), puis Vercel et trust.
#   delete-preview  : aucune installation.
name: Preview database

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

concurrency:
  # Par branche git : deux PR de la même branche partagent la même branche Neon et les mêmes variables.
  group: preview-database-${{ github.head_ref }}
  cancel-in-progress: false

env:
  # Jamais interpolé dans un script : passé par variable d'environnement (injection).
  HEAD_REF: ${{ github.head_ref }}
  # La branche par défaut est la production : les deux scripts refusent d'en faire une preview.
  DEFAULT_GIT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  migrate-preview:
    name: Migrer la base de la preview
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Une PR de fork ne reçoit pas les secrets : échec explicite plutôt qu'un job sauté.
      - name: Refuser une PR de fork
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::PR de fork : pas d'accès à Neon, base de preview impossible."
          exit 1
      - name: Refuser la branche par défaut
        if: github.head_ref == github.event.repository.default_branch
        run: |
          echo "::error::PR depuis la branche par défaut : pas de preview de la production."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # Avant pnpm install : aucun code de dépendance n'a encore tourné dans ce job.
      # Seule l'URL propriétaire est publiée : la migration n'a pas besoin de celle d'app_backend.
      - name: Créer ou retrouver la branche Neon de la preview
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_PARENT_BRANCH: production
          NEON_DATABASE: ${{ vars.NEON_DATABASE }}
          NEON_OWNER_ROLE: ${{ vars.NEON_OWNER_ROLE }}
          NODE_OPTIONS: ""
          BASH_ENV: ""
        run: >
          node scripts/ci/neon-branch.mjs create "preview/$HEAD_REF"
          --owner-env DATABASE_URL
          --ttl-hours 240
      # Plus aucun secret dans ce job à partir d'ici.
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate

  publish-preview:
    name: Publier la preview
    needs: migrate-preview
    runs-on: ubuntu-latest
    # Build Next complet du déploiement inclus (attente ≤ 12 min dans vercel-preview-env.mjs).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Scripts sans dépendance : aucune installation dans ce job.
      # Sans --owner-env : l'URL propriétaire n'existe pas dans ce job.
      - name: Réinitialiser les mots de passe et lire Neon Auth de la branche
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_PARENT_BRANCH: production
          NEON_DATABASE: ${{ vars.NEON_DATABASE }}
          NEON_OWNER_ROLE: ${{ vars.NEON_OWNER_ROLE }}
          NODE_OPTIONS: ""
          BASH_ENV: ""
        run: >
          node scripts/ci/neon-branch.mjs create "preview/$HEAD_REF"
          --app-env DATABASE_AUTHENTICATED_URL
          --ttl-hours 240
          --auth-env
      - name: Poser les variables de la preview sur Vercel et déployer
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          # Commit de la PR ; GITHUB_SHA serait le commit de fusion de test.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          NODE_OPTIONS: ""
          BASH_ENV: ""
        run: |
          node scripts/ci/vercel-preview-env.mjs sync "$HEAD_REF"
          node scripts/ci/vercel-preview-env.mjs deploy "$HEAD_REF" --origin-env PREVIEW_ORIGIN
      - name: Ajouter la preview aux domaines de confiance Neon Auth
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          TRUSTED_ORIGIN: ${{ env.PREVIEW_ORIGIN }}
          NODE_OPTIONS: ""
          BASH_ENV: ""
        run: node scripts/ci/neon-branch.mjs trust "preview/$HEAD_REF"

  delete-preview:
    name: Supprimer la base de la preview
    needs: [migrate-preview, publish-preview]
    # always() : tourne même quand un job requis a échoué ou a été sauté. Puis trois conditions :
    # - PR du dépôt (pas de fork) et pas depuis la branche par défaut : sinon aucune branche n'a été
    #   créée et les secrets manquent (fork) ; ces deux cas font échouer migrate-preview exprès, d'où ce
    #   filtre avant le test d'échec.
    # - fermeture de la PR (migrate-preview et publish-preview sautés),
    # - ou échec de la migration (publish-preview alors sauté) ou de la publication (sync, deploy, trust,
    #   délai dépassé compris) : pas de preview à moitié migrée ou publiée ; le push suivant recrée tout.
    # Run annulé (cancelled) : rien n'est supprimé, le push suivant reprend l'état existant.
    if: >-
      always()
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.head_ref != github.event.repository.default_branch
      && (github.event.action == 'closed'
        || needs.migrate-preview.result == 'failure'
        || needs.publish-preview.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Scripts sans dépendance : pas d'installation.
      - name: Supprimer les variables Vercel de la preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          NODE_OPTIONS: ""
          BASH_ENV: ""
        run: node scripts/ci/vercel-preview-env.mjs delete "$HEAD_REF"
      # Même si la suppression Vercel échoue : la branche Neon ne doit pas survivre à la PR.
      - name: Supprimer la branche Neon de la preview
        if: ${{ !cancelled() }}
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NODE_OPTIONS: ""
          BASH_ENV: ""
        run: node scripts/ci/neon-branch.mjs delete "preview/$HEAD_REF"
