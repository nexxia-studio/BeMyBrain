# Base et variables des previews (ADR-010, option A : pas d'intégration Neon–Vercel). À chaque push de
# PR, la CI crée ou retrouve la branche Neon `preview/<branche-git>` (fille de `production`, ADR-005),
# réinitialise sur elle les mots de passe du propriétaire et d'app_backend, y applique les migrations,
# pose sur Vercel les variables de runtime de la preview (DATABASE_AUTHENTICATED_URL, NEON_AUTH_*),
# limitées à la branche git, redéploie la branche (le build lancé par le push a les anciennes valeurs),
# puis ajoute l'URL de branche Vercel aux domaines de confiance Neon Auth de la branche Neon.
# À la fermeture de la PR : variables Vercel de la branche supprimées, branche Neon supprimée.
# Expiration de la branche Neon à 10 jours, repoussée à chaque push. Jamais DATABASE_URL sur Vercel.
# NEON_AUTH_COOKIE_SECRET des previews est posé à la main (toutes les previews) : la CI n'y touche pas.
# Dépôt public : toute valeur passée par $GITHUB_ENV est masquée par le script qui l'écrit.
name: Preview database

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

concurrency:
  group: preview-database-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  # Jamais interpolé dans un script : passé par variable d'environnement (injection).
  HEAD_REF: ${{ github.head_ref }}

jobs:
  migrate-preview:
    name: Migrer la base de la preview
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    # Build Next complet du redéploiement inclus (attente ≤ 12 min dans vercel-preview-env.mjs).
    timeout-minutes: 30
    steps:
      # Une PR de fork ne reçoit pas les secrets : échec explicite plutôt qu'un job sauté.
      - name: Refuser une PR de fork
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::PR de fork : pas d'accès à Neon, base de preview impossible."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # NEON_API_KEY n'existe que dans les étapes neon-branch.mjs.
      - name: Créer ou retrouver la branche Neon de la preview
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_PARENT_BRANCH: production
          NEON_DATABASE: ${{ vars.NEON_DATABASE }}
          NEON_OWNER_ROLE: ${{ vars.NEON_OWNER_ROLE }}
        run: >
          node scripts/ci/neon-branch.mjs create "preview/$HEAD_REF"
          --owner-env DATABASE_URL
          --app-env DATABASE_AUTHENTICATED_URL
          --ttl-hours 240
          --auth-env
      - run: pnpm db:migrate
      # VERCEL_TOKEN n'existe que dans cette étape (et dans celle de suppression).
      - name: Poser les variables de la preview sur Vercel et redéployer
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          # Commit de la PR ; GITHUB_SHA serait le commit de fusion de test.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/ci/vercel-preview-env.mjs sync "$HEAD_REF"
          node scripts/ci/vercel-preview-env.mjs deploy "$HEAD_REF" --origin-env PREVIEW_ORIGIN
      - name: Ajouter la preview aux domaines de confiance Neon Auth
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          TRUSTED_ORIGIN: ${{ env.PREVIEW_ORIGIN }}
        run: node scripts/ci/neon-branch.mjs trust "preview/$HEAD_REF"

  delete-preview:
    name: Supprimer la base de la preview
    # PR de fork : aucune branche n'a été créée, rien à supprimer.
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Scripts sans dépendance : pas d'installation.
      - name: Supprimer les variables Vercel de la preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
        run: node scripts/ci/vercel-preview-env.mjs delete "$HEAD_REF"
      # Même si la suppression Vercel échoue : la branche Neon ne doit pas survivre à la PR.
      - name: Supprimer la branche Neon de la preview
        if: ${{ !cancelled() }}
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: node scripts/ci/neon-branch.mjs delete "preview/$HEAD_REF"
